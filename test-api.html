<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #f5f5f5;
    }
    .test {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #666;
    }
    .success {
      border-left-color: #4caf50;
    }
    .error {
      border-left-color: #f44336;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    pre {
      background: #f5f5f5;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Quote API Testing</h1>
  <button onclick="testQuotable()">Test Quotable API</button>
  <button onclick="testZenQuotes()">Test ZenQuotes API</button>
  <button onclick="testBoth()">Test Both</button>
  <div id="results"></div>

  <script>
    const resultsDiv = document.getElementById('results');

    function addResult(title, data, isSuccess) {
      const div = document.createElement('div');
      div.className = `test ${isSuccess ? 'success' : 'error'}`;
      div.innerHTML = `
        <h3>${title}</h3>
        <pre>${JSON.stringify(data, null, 2)}</pre>
      `;
      resultsDiv.insertBefore(div, resultsDiv.firstChild);
    }

    async function testQuotable() {
      console.log('Testing Quotable API...');
      try {
        const response = await fetch('https://api.quotable.io/random');
        console.log('Response:', response);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log('Data:', data);
        addResult('✓ Quotable API Success', data, true);
      } catch (error) {
        console.error('Error:', error);
        addResult('✗ Quotable API Failed', {
          error: error.message,
          name: error.name,
          type: error.constructor.name
        }, false);
      }
    }

    async function testZenQuotes() {
      console.log('Testing ZenQuotes API...');
      try {
        const response = await fetch('https://zenquotes.io/api/random');
        console.log('Response:', response);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        console.log('Data:', data);
        addResult('✓ ZenQuotes API Success', data, true);
      } catch (error) {
        console.error('Error:', error);
        addResult('✗ ZenQuotes API Failed', {
          error: error.message,
          name: error.name,
          type: error.constructor.name
        }, false);
      }
    }

    async function testBoth() {
      await testQuotable();
      await new Promise(resolve => setTimeout(resolve, 500));
      await testZenQuotes();
    }

    // Auto-test on load
    window.addEventListener('load', () => {
      console.log('Running automatic API tests...');
      testBoth();
    });
  </script>
</body>
</html>
