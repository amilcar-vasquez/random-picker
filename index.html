<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Poster Generator</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Material Design 3 Web Components -->
    <script type="importmap">
      {
        "imports": {
          "@material/web/": "https://esm.run/@material/web/"
        }
      }
    </script>
    <script type="module">
      import '@material/web/button/filled-button.js';
      import '@material/web/progress/circular-progress.js';
    </script>
    
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Random Poster Generator</h1>
    <h3>by Amilcar Vasquez</h3>
    <br>

    <div id="poster">
      <img 
        id="posterImage" 
        src="https://picsum.photos/800/600" 
        alt="Random poster background" 
      />
      <div id="posterQuote">
        "To everything there is a season, and a time to every purpose under heaven." — King Solomon
      </div>
    </div>

    <md-filled-button id="generateBtn">
      Generate New Poster
    </md-filled-button>

    <div id="status"></div>

    <footer style="margin-top: 2rem; text-align: center; color: rgba(255,255,255,0.8); font-size: 0.9rem;">
      Inspirational quotes provided by <a href="https://zenquotes.io/" target="_blank" style="color: white; text-decoration: underline;">ZenQuotes API</a>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
